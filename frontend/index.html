<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #visualizador {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #btn-reset {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            padding: 8px 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="visualizador">
        <button id="btn-reset">Resetar vista</button>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
